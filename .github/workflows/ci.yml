name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix web
      - name: Format, types and production build
        run: |
          npm run format:check --prefix web
          npm run build --prefix web
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Agent and MSI
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned vcpkg revision
        id: vcpkg
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "revision=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.revision }}
          path: build/tools/vcpkg
          persist-credentials: false
      - name: Configure dependency cache
        id: cache-context
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$(Join-Path $env:GITHUB_WORKSPACE 'build/tools/vcpkg')" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "VCPKG_MAX_CONCURRENCY=4" >> $env:GITHUB_ENV
          if (!$env:ImageOS -or !$env:ImageVersion) { throw 'Runner image identity is missing' }
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      # Binary ABIs are checked by vcpkg. A new runner image needs a new
      # immutable Actions key so rebuilt packages can actually be saved.
      - name: Restore vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/vcpkg-cache
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ steps.vcpkg.outputs.revision }}-${{ steps.cache-context.outputs.image }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ steps.vcpkg.outputs.revision }}-${{ steps.cache-context.outputs.image }}-
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ steps.vcpkg.outputs.revision }}-
      - name: Bootstrap vcpkg
        run: |
          if ($IsWindows) { & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics }
          else { & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake --preset windows-agent-release
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset windows-agent-release --parallel 4
      - name: Functional unit tests
        run: ctest --preset windows-agent-release --no-tests=error -L unit --output-junit test-results.xml
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-windows-agent-${{ github.sha }}
          path: |
            build/windows-agent/test-results.xml
            test-results.xml
            build/windows-agent/vcpkg-manifest-install.log
            build/windows-agent/Testing/Temporary/LastTest.log
            build/windows-agent/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
      - name: Package MSI
        env:
          GATEWAY_HOST: ${{ vars.ULTRATERIMAL_GATEWAY_HOST || 'localhost' }}
          GATEWAY_ADDRESS: ${{ vars.ULTRATERIMAL_GATEWAY_ADDRESS || 'localhost' }}
        run: |
          $ca = Join-Path (Split-Path (Split-Path (git --exec-path))) 'etc/ssl/certs/ca-bundle.crt'
          if (-not (Test-Path -LiteralPath $ca)) { throw 'Git for Windows CA bundle is missing' }
          [xml]$wix = Get-Content agent/platform/windows/agent.wxs
          $version = $wix.Wix.Product.Version
          & agent/platform/windows/package_agent.ps1 -AgentExe build/windows-agent/agent/Release/agent.exe -LoginDll build/windows-agent/agent/Release/ultraterimal_login.dll -CaBundle $ca -Output "build/windows-installer/ultraterimal-agent-$version.msi" -GatewayHost $env:GATEWAY_HOST -GatewayAddress $env:GATEWAY_ADDRESS
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            build/windows-installer/*.msi
            build/windows-installer/*.json
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux Server
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned vcpkg revision
        id: vcpkg
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "revision=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.revision }}
          path: build/tools/vcpkg
          persist-credentials: false
      - name: Linux compiler and build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-tools-19 g++-14 nasm ninja-build pkg-config autoconf automake libtool
          echo 'CC=clang-19' >> "$GITHUB_ENV"
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"
      - name: Configure dependency cache
        id: cache-context
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$(Join-Path $env:GITHUB_WORKSPACE 'build/tools/vcpkg')" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "VCPKG_MAX_CONCURRENCY=4" >> $env:GITHUB_ENV
          if (!$env:ImageOS -or !$env:ImageVersion) { throw 'Runner image identity is missing' }
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/vcpkg-cache
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-clang19-gcc14-x64-linux-${{ steps.vcpkg.outputs.revision }}-${{ steps.cache-context.outputs.image }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-clang19-gcc14-x64-linux-${{ steps.vcpkg.outputs.revision }}-${{ steps.cache-context.outputs.image }}-
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-clang19-gcc14-x64-linux-${{ steps.vcpkg.outputs.revision }}-
            vcpkg-ubuntu24-clang19-gcc14-
      - name: Bootstrap vcpkg
        run: |
          if ($IsWindows) { & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics }
          else { & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake --preset linux-server-release
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset linux-server-release --parallel 4
      - name: Functional unit tests
        run: ctest --preset linux-server-release --no-tests=error -L unit --output-junit test-results.xml
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-linux-server-${{ github.sha }}
          path: |
            build/linux-server/test-results.xml
            test-results.xml
            build/linux-server/vcpkg-manifest-install.log
            build/linux-server/Testing/Temporary/LastTest.log
            build/linux-server/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf build/linux-server.tar.gz -C build/linux-server/server gateway
      - name: Upload Linux Server
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-server-${{ github.sha }}
          path: build/linux-server.tar.gz
          if-no-files-found: error
          retention-days: 14
