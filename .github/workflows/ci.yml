name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/build/tools/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache

jobs:
  resolve_toolchain:
    name: Resolve LLVM toolchain and dependency pins
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sha256: ${{ steps.resolve.outputs.sha256 }}
      vcpkg_commit: ${{ steps.resolve.outputs.vcpkg_commit }}
      ruvia_commit: ${{ steps.resolve.outputs.ruvia_commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve toolchain release and verified checksum
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api repos/cross-tools/clang-cross/releases/latest)"
          release="$(jq -er '.tag_name' <<< "$release_json")"
          [[ "$release" =~ ^[A-Za-z0-9._-]+$ ]]
          asset=x86_64-unknown-linux-musl.tar.xz
          jq -e --arg name "$asset" '.assets | any(.name == $name)' <<< "$release_json" > /dev/null
          checksum="$(curl -fsSL "https://github.com/cross-tools/clang-cross/releases/download/$release/$asset.sha256")"
          read -r sha256 _ <<< "$checksum"
          [[ "$sha256" =~ ^[[:xdigit:]]{64}$ ]]
          vcpkg_commit="$(jq -er '."builtin-baseline"' vcpkg.json)"
          ruvia_commit="$(sed -nE 's/^    GIT_TAG ([0-9a-f]{40})\)/\1/p' CMakeLists.txt)"
          [[ "$vcpkg_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ruvia_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'release=%s\nsha256=%s\nvcpkg_commit=%s\nruvia_commit=%s\n' \
            "$release" "${sha256,,}" "$vcpkg_commit" "$ruvia_commit" >> "$GITHUB_OUTPUT"

  web:
    name: Web frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install licensed dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Functional unit tests
        run: bun run test
      - name: Typecheck and build
        run: bun run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-${{ github.sha }}
          path: build/web/index.html
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux Server LLVM musl
    needs: [resolve_toolchain, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: '1'
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup LLVM musl build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          toolchain-release: ${{ needs.resolve_toolchain.outputs.release }}
          toolchain-sha256: ${{ needs.resolve_toolchain.outputs.sha256 }}
          vcpkg-commit: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
      - name: Check C++ formatting
        run: |
          set -euo pipefail
          clang-format --version
          git ls-files -z '*.h' '*.cpp' | xargs -0 -n 80 clang-format --dry-run --Werror
      - name: Configure Release
        id: configure
        run: |
          cmake -S . -B build/linux-server -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-musl \
            -DVCPKG_HOST_TRIPLET=x64-linux-musl \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/llvm.cmake" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg-linux-musl-installed" \
            -DVCPKG_MANIFEST_FEATURES=server \
            -DULTRATERIMAL_BUILD_AGENT=OFF -DULTRATERIMAL_BUILD_SERVER=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.setup.outputs.vcpkg-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.setup.outputs.vcpkg-cache-key }}
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build/linux-server --parallel "$(nproc)"
          ccache --show-stats
      - name: Functional unit tests
        run: ctest --test-dir build/linux-server --no-tests=error -L unit --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/linux-server/test-results.xml"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.setup.outputs.compiler-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.setup.outputs.compiler-cache-key }}
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-linux-server-${{ github.sha }}
          path: |
            build/linux-server/test-results.xml
            build/linux-server/Testing/Temporary/LastTest.log
            build/linux-server/vcpkg-manifest-install.log
            build/linux-server/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
      - name: Download frontend from this revision
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-${{ github.sha }}
          path: build/server-release/web
      - name: Assemble static Server release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUVIA_COMMIT: ${{ needs.resolve_toolchain.outputs.ruvia_commit }}
          VCPKG_COMMIT: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
          TOOLCHAIN_RELEASE: ${{ needs.resolve_toolchain.outputs.release }}
          TOOLCHAIN_SHA256: ${{ needs.resolve_toolchain.outputs.sha256 }}
        run: |
          set -euo pipefail
          binary=build/linux-server/server/gateway
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'Server executable requires a dynamic loader' >&2
            exit 1
          fi
          install -Dm755 "$binary" build/server-release/bin/gateway
          jq -n --arg commit "$SOURCE_COMMIT" --arg ruvia "$RUVIA_COMMIT" \
            --arg vcpkg "$VCPKG_COMMIT" --arg toolchain "$TOOLCHAIN_RELEASE" \
            --arg toolchain_sha256 "$TOOLCHAIN_SHA256" \
            '{commit: $commit, ruvia: $ruvia, vcpkg: $vcpkg, toolchain: $toolchain, toolchain_sha256: $toolchain_sha256}' \
            > build/server-release/release.json
          (cd build/server-release && sha256sum bin/gateway web/index.html release.json > SHA256SUMS)
          tar -czf build/linux-server.tar.gz -C build/server-release bin web release.json SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-server-${{ github.sha }}
          path: build/linux-server.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Agent MSVC and MSI
    needs: resolve_toolchain
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          install: false
          cache: false
      - name: Install CMake
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise use --global cmake@latest
      - name: Bootstrap pinned vcpkg
        env:
          VCPKG_COMMIT: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_MAX_CONCURRENCY=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          "RUNNER_IMAGE=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_ENV
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
      - name: Restore vcpkg binary cache
        id: vcpkg
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-v3-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ needs.resolve_toolchain.outputs.vcpkg_commit }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'ports/**') }}
          restore-keys: |
            vcpkg-v3-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ needs.resolve_toolchain.outputs.vcpkg_commit }}-${{ env.RUNNER_IMAGE }}-
      - name: Configure Release
        id: configure
        run: |
          $configureArguments = @(
            '-S', '.', '-B', 'build/windows-agent', '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static',
            '-DVCPKG_HOST_TRIPLET=x64-windows-static',
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/build/vcpkg_installed",
            '-DULTRATERIMAL_BUILD_AGENT=ON', '-DULTRATERIMAL_BUILD_SERVER=OFF',
            '-DBUILD_TESTING=ON', '-DCMAKE_COMPILE_WARNING_AS_ERROR=ON',
            '-DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON'
          )
          cmake @configureArguments
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build build/windows-agent --config Release --parallel $([Environment]::ProcessorCount)
      - name: Functional unit tests
        run: ctest --test-dir build/windows-agent -C Release --no-tests=error -L unit --output-on-failure --output-junit "$env:GITHUB_WORKSPACE/build/windows-agent/test-results.xml"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-windows-agent-${{ github.sha }}
          path: |
            build/windows-agent/test-results.xml
            build/windows-agent/Testing/Temporary/LastTest.log
            build/windows-agent/vcpkg-manifest-install.log
            build/windows-agent/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Package MSI
        env:
          GATEWAY_HOST: ${{ vars.ULTRATERIMAL_GATEWAY_HOST || 'localhost' }}
          GATEWAY_ADDRESS: ${{ vars.ULTRATERIMAL_GATEWAY_ADDRESS || 'localhost' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ca = Join-Path (Split-Path (Split-Path (git --exec-path))) 'etc/ssl/certs/ca-bundle.crt'
          if (-not (Test-Path -LiteralPath $ca)) { throw 'Git for Windows CA bundle is missing' }
          [xml]$wix = Get-Content agent/platform/windows/agent.wxs
          $version = $wix.Wix.Package.Version
          $packageArguments = @{
            AgentExe = 'build/windows-agent/agent/Release/agent.exe'
            LoginDll = 'build/windows-agent/agent/Release/ultraterimal_login.dll'
            CaBundle = $ca
            DependencyRoot = 'build/vcpkg_installed/x64-windows-static'
            RuviaRoot = 'build/windows-agent/_deps/ruvia-src'
            Output = "build/windows-installer/ultraterimal-agent-$version.msi"
            GatewayHost = $env:GATEWAY_HOST
            GatewayAddress = $env:GATEWAY_ADDRESS
          }
          & agent/platform/windows/package_agent.ps1 @packageArguments
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            build/windows-installer/*.msi
            build/windows-installer/*.json
          if-no-files-found: error
          retention-days: 14
