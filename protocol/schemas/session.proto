syntax = "proto3";
package ultraterimal.wire;

// First record of an authenticated TLS/QUIC connection, before Envelope traffic.
message NativeConnect {
  enum Purpose { UNSPECIFIED = 0; CONTROL = 1; DESKTOP_CHANNEL = 2; ENROLLMENT = 3; AGENT_UPDATE = 4; }
  uint32 protocol_version = 1;
  Purpose purpose = 2;
  bytes credential = 3;
  bytes enrollment_code = 4;
  string device_name = 5;
}
message NativeAccepted {
  uint32 protocol_version = 1;
  bool accepted = 2;
  string device_id = 3;
  bytes credential = 4;
}

enum SessionKind { SESSION_UNSPECIFIED = 0; DESKTOP = 1; VNC = 2; SSH = 3; }
enum ChannelPurpose { CHANNEL_UNSPECIFIED = 0; DEVICE_CONTROL = 1; DESKTOP_INPUT = 2; DESKTOP_VIDEO = 3; VNC_STREAM = 4; SSH_STREAM = 5; }
message Capabilities {
  bool conpty = 1;
  bool capture_available = 2;
  bool h264_software = 3;
  bool h264_hardware = 4;
  bool h265_hardware = 5;
  bool vnc = 6;
  bool ssh = 7;
  uint32 display_count = 8;
  bool windows_login_settings = 9;
  bool system_restart = 10;
  uint64 boot_time_unix_seconds = 11;
  // Contract 1: each writable desktop InputEvent carries its input binding's Envelope.generation.
  uint32 desktop_input_contract = 12;
  bool agent_update = 13;
}
// Update packages travel over an independent authenticated native connection.
message AgentUpdate { string version = 1; string sha256 = 2; uint64 size = 3; }
message AgentUpdateChunk { uint64 offset = 1; bytes data = 2; }
message Hello { string device_id = 1; string agent_version = 2; Capabilities capabilities = 3; }
message Welcome {
  uint32 heartbeat_seconds = 1;
  bool agent_logs = 2;
}
// Allowlisted metadata only. No exception text, paths, credentials or screen data.
message DesktopFault {
  enum Stage {
    STAGE_UNKNOWN = 0;
    WORKER_STARTUP = 1;
    VIDEO_START = 2;
    CAPTURE_ENCODE = 3;
    DISPLAY_RESIZE = 4;
    INPUT_BINDING = 5;
    INPUT_RELEASE = 6;
    INPUT_APPLY = 7;
    INPUT_VALIDATION = 8;
    INPUT_IPC_READ = 9;
    CONTROL_IPC_WRITE = 10;
    VIDEO_IPC_WRITE = 11;
    LIVENESS = 12;
    NATIVE_PAIRING = 13;
    WORKER_LAUNCH = 14;
    WORKER_PIPE_PAIRING = 15;
    LOGIN_BROKER = 16;
    SESSION_BRIDGE = 17;
    WORKER_READY_WAIT = 18;
    WORKER_EXIT = 19;
    BRIDGE_WORKER_READ = 20;
    BRIDGE_CONTROL_SEND = 21;
    BRIDGE_VIDEO_SEND = 22;
    BRIDGE_INPUT_RECEIVE = 23;
    BRIDGE_VIDEO_RECEIVE = 24;
  }
  enum Code {
    CODE_UNKNOWN = 0;
    DISPLAY_UNAVAILABLE = 1;
    DESKTOP_UNAVAILABLE = 2;
    CAPTURE_RESET = 3;
    CAPTURE_ACCESS_DENIED = 4;
    CAPTURE_UNSUPPORTED = 5;
    CAPTURE_DEVICE_LOST = 6;
    CAPTURE_BUSY = 7;
    INVALID_GEOMETRY = 8;
    ENCODE_FAILED = 9;
    INPUT_FAILED = 10;
    IPC_FAILED = 11;
    STARTUP_TIMEOUT = 12;
    LIVENESS_TIMEOUT = 13;
    EXIT_TIMEOUT = 14;
    PROTOCOL_REJECTED = 15;
    SYSTEM_FAILURE = 16;
    INTERNAL_FAILURE = 17;
    PROCESS_EXIT = 18;
  }
  Stage stage = 1;
  Code code = 2;
  uint32 windows_session_id = 3;
  uint32 process_id = 4;
}
// Fixed events only: never transport credentials, exception strings or screen data.
message AgentLog {
  enum Event {
    UNSPECIFIED = 0;
    STARTED = 1;
    CONNECTED = 2;
    CONNECT_FAILED = 3;
    READ_FAILED = 4;
    WRITE_FAILED = 5;
    HEARTBEAT_TIMEOUT = 6;
    DESKTOP_STARTED = 7;
    DESKTOP_ENDED = 8;
    DESKTOP_FAILED = 9;
    DESKTOP_REJECTED = 10;
    UPDATE_STARTED = 11;
    UPDATE_FAILED = 12;
    UPDATE_COMPLETED = 13;
  }
  uint64 sequence = 1;
  uint64 unix_milliseconds = 2;
  Event event = 3;
  string session_id = 4;
  uint32 exit_code = 5;
  bool forced_exit = 6;
  DesktopFault desktop_fault = 7;
}
message AgentLogBatch {
  string runtime_id = 1;
  repeated AgentLog entries = 2;
  uint64 dropped = 3;
}
message AgentLogAck { uint64 sequence = 1; }
message Heartbeat { uint64 monotonic_milliseconds = 1; }
message ChannelGrant { string channel_id = 1; ChannelPurpose purpose = 2; bytes ticket = 3; }
message SessionOpen { SessionKind kind = 1; string user_id = 2; reserved 3, 4; reserved "operating_system_user"; bool write_control = 5; repeated ChannelGrant channels = 6; uint32 desktop_input_contract = 7; }
message ChannelOpen { ChannelPurpose purpose = 1; bytes ticket = 2; }
message ChannelReady { ChannelPurpose purpose = 1; uint32 desktop_optimization_contract = 2; bool continuous_frames = 3; }
// Local service/desktop IPC only. No device credential or remote channel ticket.
message DesktopStart { uint32 windows_session_id = 1; uint32 display_index = 2; bool write_control = 3; uint32 desktop_input_contract = 4; uint32 desktop_optimization_contract = 5; bool continuous_frames = 6; }
message DesktopReady {}
message ChannelData { bytes data = 1; }
message SessionClose { string reason = 1; }
message SessionError { string code = 1; string message = 2; }
message DisplayMode { uint32 width = 1; uint32 height = 2; }
message VideoConfig { string codec = 1; uint32 width = 2; uint32 height = 3; bytes description = 4; repeated DisplayMode display_modes = 5; bool desktop_optimization = 6; uint32 desktop_optimization_contract = 7; bool continuous_frames = 8; }
message DesktopResize { uint64 request_id = 1; uint32 width = 2; uint32 height = 3; }
message DesktopResizeResult { uint64 request_id = 1; bool applied = 2; }
// Service -> browser. Zero means dispatched, not confirmation of a UI transition.
message DesktopSecureAttentionResult { uint32 win32_error = 1; }
// Device control only: never forwarded to the desktop worker or echoed in a reply.
message WindowsLoginRequest {
  enum Action { UNSPECIFIED = 0; READ = 1; SAVE = 2; CLEAR = 3; }
  uint64 request_id = 1;
  Action action = 2;
  string username = 3;
  string domain = 4;
  string password = 5;
}
message WindowsLoginResult {
  uint64 request_id = 1;
  bool success = 2;
  bool saved = 3;
  string username = 4;
  string domain = 5;
}
message WindowsRestartRequest {
  string operation_id = 1;
  string device_id = 2;
  uint64 expires_at_unix_seconds = 3;
}
message WindowsRestartResult {
  enum Status { UNSPECIFIED = 0; ACCEPTED = 1; FAILED = 2; UNKNOWN = 3; }
  string operation_id = 1;
  Status status = 2;
  uint32 win32_error = 3;
}
message VideoFrame {
  bytes data = 1;
  bool key_frame = 2;
  uint64 timestamp_microseconds = 3;
  // Agent wall time for update preparation and encoding, including rejected
  // region/PNG attempts. Excludes capture, pacing, transport and browser decode.
  // Zero means unavailable (older Agent); stage_timing preserves measured zero.
  uint32 encode_microseconds = 4;
  // Meaningful only when encode_microseconds is nonzero.
  bool hardware_encoding = 5;
  // Encoder rate snapshot applied to this frame. Both fields absent means
  // unavailable (older Agent); values do not claim delivered rate.
  optional uint32 target_frames_per_second = 6;
  optional uint32 target_bitrate = 7;
  bool gpu_encoding = 8; // No full-frame CPU readback or CPU color conversion.
  DesktopStageTiming stage_timing = 9;
  // A real encoded picture with unchanged content. Envelope.frame_id still
  // advances receiver credit; base_frame_id names the stable content frame.
  // Requires continuous_frames at the VideoConfig generation barrier.
  bool repeated = 10;
}
message DesktopFlowSample {
  uint32 frame_window = 1;
  uint32 byte_window = 2;
  uint32 pending_frames = 3;
  uint32 pending_bytes = 4;
  uint32 pressure_bytes = 5;
  uint32 path_delay_microseconds = 6;
  uint32 oldest_frame_age_microseconds = 7;
  uint32 delivery_bytes_per_second = 8; // Zero means no capacity sample.
  uint32 worker_dispatch_microseconds = 9; // Whole completed compute job.
  uint32 credit_wait_microseconds = 10; // Credit-only wait, excludes pacing.
  uint32 blocking_flags = 11; // Background=1, frame window=2, bytes=4, age=8.
  uint32 input_apply_max_microseconds = 12;
  uint32 input_events = 13;
  optional uint32 owner_loop_late_microseconds = 14;
}
// Local durations only, each <= 60000000 us. Presence distinguishes unexecuted
// stages from measured zero. Stages may overlap: never sum as total latency.
message DesktopStageTiming {
  optional uint32 worker_queue_microseconds = 1;
  optional uint32 acquire_wait_microseconds = 2;
  optional uint32 source_age_microseconds = 3;
  optional uint32 pacing_credit_wait_microseconds = 4;
  optional uint32 gpu_sync_wait_microseconds = 5;
  optional uint32 readback_ready_microseconds = 6;
  optional uint32 prepare_cpu_microseconds = 7;
  optional uint32 png_encode_microseconds = 8;
  optional uint32 video_encode_microseconds = 9;
  uint32 coalesced_captures = 10;
}
// Browser-local software stages, not physical presentation or remote-clock deltas.
message DesktopBrowserTiming {
  optional uint32 receive_queue_microseconds = 1;
  optional uint32 decode_microseconds = 2;
  optional uint32 canvas_submit_microseconds = 3;
  optional uint32 png_decode_microseconds = 4;
  optional uint32 baseline_wait_microseconds = 5;
}
message Rectangle { uint32 x = 1; uint32 y = 2; uint32 width = 3; uint32 height = 4; }
message FullFrame { uint32 width = 1; uint32 height = 2; bytes rgba = 3; }
message CopyRect { Rectangle destination = 1; uint32 source_x = 2; uint32 source_y = 3; }
// cache_slot 1..128 defines/reuses a generation-scoped 128x64-or-smaller tile.
// Empty png requires a previously defined slot of exactly the same dimensions.
// Zero is an uncached PNG (also the only form allowed in legacy DiffBatch).
message PatchRect { Rectangle destination = 1; bytes png = 2; uint32 cache_slot = 3; }
message DiffBatch { repeated CopyRect copies = 1; repeated PatchRect patches = 2; }
// POINTER_MOVE: output-local physical pixels. BUTTON: 0 left, 1 middle, 2 right,
// 3 back, 4 forward. KEY: Windows virtual-key code (left/right modifiers),
// 0x10D for keypad Enter. WHEEL: code 0 vertical / 1 horizontal, delta in 120ths
// of a detent, positive up/right. Unused fields must be zero. RELEASE_ALL
// releases only input pressed by this session.
// For desktop_input_contract=2, all writable input (including RELEASE_ALL) carries
// the video/input binding generation in the enclosing Envelope, stamped when queued.
message InputEvent { enum Kind { UNSPECIFIED = 0; POINTER_MOVE = 1; BUTTON = 2; KEY = 3; WHEEL = 4; RELEASE_ALL = 5; SECURE_ATTENTION = 6; } Kind kind = 1; sint32 x = 2; sint32 y = 3; uint32 code = 4; bool pressed = 5; sint32 wheel_delta = 6; }
// x/y locate the hotspot within the selected display. Draw at x-hotspot_x,
// y-hotspot_y. Empty rgba retains the previous shape and its hotspot.
message CursorUpdate { sint32 x = 1; sint32 y = 2; uint32 width = 3; uint32 height = 4; uint32 hotspot_x = 5; uint32 hotspot_y = 6; bytes rgba = 7; bool visible = 8; }
// A bounded window of distinct desktop canvas frames observed in foreground
// requestAnimationFrame callbacks. These occur BEFORE physical presentation.
// Windows overlap across reports: counts must never be summed as frame totals.
message VisibleFrameTiming {
  uint32 sample_count = 1;
  uint32 p95_microseconds = 2;
  uint32 p99_microseconds = 3;
  // Count of intervals >= 100 ms among sample_count intervals.
  uint32 long_gap_count = 4;
  // Distinct frames observed by visible rAF during the last ~1s report interval.
  uint32 observed_fps_milli = 5;
}
message QualityFeedback {
  reserved 6;
  reserved "preference";
  uint64 displayed_frame = 1;
  uint32 decode_microseconds = 2;
  uint32 queue_depth = 3;
  bool background = 4;
  uint64 displayed_generation = 5;
  // Maximum received, not-yet-displayed video frames the client can accept.
  // Zero/omitted means the legacy limit of 16; valid explicit values are 1..128.
  uint32 maximum_pending_video_frames = 7;
  // Opt-in: video bottom layer with bounded, frame-bound PNG detail patches.
  bool video_refinement = 9;
  // Browser-only diagnostics, consumed by the gateway. At most once per 5 s.
  VisibleFrameTiming visible_frame_timing = 8;
  // Gateway-consumed diagnostics associated with displayed_generation/frame.
  // Does not participate in QoS; decode_microseconds above retains its meaning.
  DesktopBrowserTiming browser_timing = 10;
}
enum RefinementKind { UNSPECIFIED = 0; STATIC_DETAIL = 1; DYNAMIC_DETAIL = 2; }
// Applied only to the matching composed canvas, never to a newer baseline.
// Envelope frame_id == base_frame_id. Legacy batch_id/kind are zero; v2 batch
// IDs strictly increase within generation (gaps allowed), with uncached PNGs.
message VideoRefinement {
  repeated PatchRect patches = 1;
  uint64 batch_id = 2;
  RefinementKind kind = 3;
  DesktopStageTiming stage_timing = 4;
}
// Independent, non-coalescible input-channel ACK. Envelope generation/frame_id
// identify the canvas, base_frame_id=0. Late/duplicate tuples are runtime no-ops.
message DesktopRefinementAck {
  enum Status { UNSPECIFIED = 0; APPLIED = 1; SUPERSEDED = 2; }
  uint64 batch_id = 1;
  Status status = 2;
}
// Agent input-channel diagnostics only. Server consumes, never forwards to Browser.
message DesktopPipelineSample {
  uint64 generation = 1;
  uint64 frame_id = 2;
  uint64 batch_id = 3;
  enum Source { UNSPECIFIED = 0; DESKTOP_WORKER = 1; AGENT_RELAY = 2; }
  Source source = 4;
  optional uint32 ipc_write_microseconds = 5;
  optional uint32 send_queue_wait_microseconds = 6;
  optional uint32 native_write_microseconds = 7;
  DesktopFlowSample flow_sample = 8; // Worker primary frames only, batch_id=0.
}
message DesktopPipelineReport {
  repeated DesktopPipelineSample samples = 1; // At most 32, best effort.
  uint32 dropped_samples = 2;
}
// Atomic updates to the composed canvas. All copies read the PREVIOUS canvas,
// then patches are applied. Does not change the video decoder's reference frames.
message DesktopRegionUpdate {
  repeated CopyRect copies = 1;
  repeated PatchRect patches = 2;
  uint32 encode_microseconds = 3;
  uint32 target_frames_per_second = 4;
  uint32 target_bitrate = 5;
  DesktopStageTiming stage_timing = 6;
}
enum VideoCodec { VIDEO_CODEC_UNSPECIFIED = 0; AVC = 1; HEVC = 2; AV1 = 3; }
// Sent on the authenticated input channel; independent of frame ACKs. Missing
// capabilities preserve the deployed H264/uncached-refinement contract.
message DesktopVideoCapabilities {
  repeated VideoCodec codecs = 1;
  bool region_updates = 2;
  bool tile_cache = 3;
  uint32 desktop_optimization_contract = 4;
  bool continuous_frames = 5;
}
message RequestRefresh {}
// Agent issues monotonically increasing nonces on the input channel and retains
// a bounded number in flight for delayed acknowledgments; browser echoes each
// nonce in the ordered input stream. A lease reset requires a fresh reset probe.
message DesktopProbe {
  uint32 nonce = 1;
  // Legacy worker reset notification; current workers never pause input for slow probes.
  bool reset_input = 2;
  // Agent -> browser only: greatest accepted response nonce. Zero until one is
  // accepted; less than nonce. Diagnostic evidence, not an input gating condition.
  uint32 accepted_response_nonce = 3;
}
message TerminalData { bytes data = 1; }
message TerminalResize { uint32 columns = 1; uint32 rows = 2; }
message TerminalExit { uint32 exit_code = 1; }
// Local SYSTEM service <-> LogonUI pipe only; never an Envelope body.
message WindowsLoginHello {
  enum Scenario { UNSPECIFIED = 0; LOGON = 1; UNLOCK = 2; }
  uint32 version = 1;
  uint32 windows_session_id = 2;
  Scenario scenario = 3;
}
message WindowsLoginDelivery {
  uint32 version = 1;
  fixed64 expires_at = 2;
  uint32 authentication_package = 3;
  bytes protected_logon = 4;
  string account = 5;
  string sid = 6;
  WindowsLoginHello.Scenario scenario = 7;
}
message Envelope {
  uint32 protocol_version = 1;
  string session_id = 2;
  string channel_id = 3;
  uint64 sequence = 4;
  uint64 generation = 5;
  uint64 frame_id = 6;
  uint64 base_frame_id = 7;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Heartbeat heartbeat = 12;
    SessionOpen session_open = 13;
    SessionClose session_close = 14;
    SessionError session_error = 15;
    ChannelOpen channel_open = 16;
    ChannelData channel_data = 17;
    VideoConfig video_config = 18;
    VideoFrame video_frame = 19;
    FullFrame full_frame = 20;
    DiffBatch diff_batch = 21;
    InputEvent input_event = 22;
    CursorUpdate cursor_update = 23;
    QualityFeedback quality_feedback = 24;
    RequestRefresh request_refresh = 25;
    TerminalData terminal_data = 26;
    TerminalResize terminal_resize = 27;
    TerminalExit terminal_exit = 28;
    ChannelReady channel_ready = 29;
    DesktopStart desktop_start = 30;
    DesktopReady desktop_ready = 31;
    DesktopResize desktop_resize = 32;
    DesktopResizeResult desktop_resize_result = 33;
    WindowsLoginRequest windows_login_request = 34;
    WindowsLoginResult windows_login_result = 35;
    DesktopProbe desktop_probe = 36;
    WindowsRestartRequest windows_restart_request = 37;
    WindowsRestartResult windows_restart_result = 38;
    AgentLogBatch agent_logs = 39;
    AgentLogAck agent_log_ack = 40;
    AgentUpdate agent_update = 41;
    DesktopSecureAttentionResult desktop_secure_attention_result = 42;
    VideoRefinement video_refinement = 43;
    DesktopRegionUpdate desktop_region_update = 44;
    DesktopVideoCapabilities desktop_video_capabilities = 45;
    DesktopRefinementAck desktop_refinement_ack = 46;
    DesktopPipelineReport desktop_pipeline_report = 47;
  }
}
